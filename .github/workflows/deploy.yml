name: Deploy to S3

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy HTML (no-cache)
        run: |
          aws s3 cp frontend/index.html \
            s3://bast-traffic-demo-112220711619/index.html \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp frontend/architecture.html \
            s3://bast-traffic-demo-112220711619/architecture.html \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Deploy data files (1h cache)
        run: |
          aws s3 sync frontend/data/ \
            s3://bast-traffic-demo-112220711619/data/ \
            --cache-control "public, max-age=3600" \
            --exclude "*.gz"

          if [ -f frontend/data/stations_map.json.gz ]; then
            aws s3 cp frontend/data/stations_map.json.gz \
              s3://bast-traffic-demo-112220711619/data/stations_map.json \
              --content-type "application/json" \
              --content-encoding gzip \
              --cache-control "public, max-age=3600"
          fi
